# Example qmk-state-daemon config for native i3status-rust custom_dbus.
# i3status-rust creates the D-Bus object from config-example.toml; this
# daemon sink is a client that calls SetText/SetIcon on that object for
# every deduped keyboard state change.

vid = "0x303A"
pid = "0x4044"

[sink]
kind = "dbus"
event = "qmk_state_changed"
service = "rs.i3status"
path = "/qmk_state"
interface = "rs.i3status.custom"
text = "{top_layer_name} {mods_letters}"
short_text = "{top_layer_name}"
icon = "keyboard"
