[package]
name = "qmk-state-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Rust daemon that reads raw-HID state packets from QMK/Vial keyboards and drives a sketchybar indicator"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "qmk_state_daemon"
path = "src/lib.rs"

[[bin]]
name = "qmk-state-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
toml = "0.8"
zbus = { version = "4", features = ["blocking"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
